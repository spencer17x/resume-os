name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: vX.Y.Z tag to create or redeploy
        required: true
        type: string
      sha:
        description: Full main commit SHA produced by the merged release PR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Resolve main release revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      tag_name: ${{ steps.result.outputs.tag_name }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - name: Require a main-branch workflow dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] \
            || [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from refs/heads/main."
            exit 1
          fi

      - name: Check out main with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release for deployment
        id: result
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          MANUAL_SHA: ${{ inputs.sha }}
        run: |
          release_tag="$MANUAL_TAG"
          if ! printf '%s\n' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The release tag must match vX.Y.Z."
            exit 1
          fi
          if ! printf '%s\n' "$MANUAL_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "The release SHA must be a full 40-character commit SHA."
            exit 1
          fi

          release_sha="$(git rev-parse --verify "$MANUAL_SHA^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Commit $release_sha is not reachable from origin/main."
            exit 1
          fi

          release_version="${release_tag#v}"
          package_version="$(git show "$release_sha:package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"
          if [ "$release_version" != "$package_version" ]; then
            echo "Tag $release_tag does not match package.json version $package_version."
            exit 1
          fi

          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag_name=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

  quality-release:
    name: Validate released revision
    needs:
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      node_version: ${{ steps.release-profile.outputs.node_version }}
      pnpm_version: ${{ steps.release-profile.outputs.pnpm_version }}
      quality_profile: ${{ steps.release-profile.outputs.quality_profile }}
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preserve trusted release profile resolver
        run: cp scripts/release-profile.mjs "$RUNNER_TEMP/release-profile.mjs"

      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Resolve released toolchain and quality profile
        id: release-profile
        run: node "$RUNNER_TEMP/release-profile.mjs"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.release-profile.outputs.node_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          PNPM_VERSION: ${{ steps.release-profile.outputs.pnpm_version }}
        run: corepack "pnpm@$PNPM_VERSION" install --frozen-lockfile

      - name: Run release quality check
        env:
          PNPM_VERSION: ${{ steps.release-profile.outputs.pnpm_version }}
          QUALITY_PROFILE: ${{ steps.release-profile.outputs.quality_profile }}
        run: |
          case "$QUALITY_PROFILE" in
            check)
              corepack "pnpm@$PNPM_VERSION" check
              ;;
            legacy)
              echo "Release predates pnpm check; running its historical quality gate."
              corepack "pnpm@$PNPM_VERSION" typecheck
              corepack "pnpm@$PNPM_VERSION" lint
              corepack "pnpm@$PNPM_VERSION" test
              corepack "pnpm@$PNPM_VERSION" test:production-extraction
              ;;
            *)
              echo "Unsupported quality profile: $QUALITY_PROFILE"
              exit 1
              ;;
          esac

  publish-release:
    name: Publish tag and GitHub Release
    needs:
      - release
      - quality-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect live tag and Release state
        id: release-state
        run: |
          state_json="$(node scripts/release-state.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA")"
          echo "action=$(printf '%s' "$state_json" | jq -r .action)" >> "$GITHUB_OUTPUT"
          echo "state=$(printf '%s' "$state_json" | jq -r .state)" >> "$GITHUB_OUTPUT"

      - name: Verify a new release commit title
        if: steps.release-state.outputs.action == 'create'
        run: |
          release_subject="$(git show -s --format=%s "$RELEASE_SHA")"
          if [ "$release_subject" != "chore(release): $RELEASE_TAG" ]; then
            echo "New release commit must be titled chore(release): $RELEASE_TAG."
            exit 1
          fi

      - name: Create tag and GitHub Release
        if: steps.release-state.outputs.action == 'create'
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$RELEASE_SHA"
          --title "$RELEASE_TAG"
          --generate-notes

      - name: Publish GitHub Release from an existing tag
        if: steps.release-state.outputs.action == 'publish'
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes

      - name: Verify published tag and Release state
        id: published-state
        run: |
          state_json="$(node scripts/release-state.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --expect-published)"
          echo "release_url=$(printf '%s' "$state_json" | jq -r .releaseUrl)" >> "$GITHUB_OUTPUT"

      - name: Summarize GitHub Release
        env:
          RELEASE_URL: ${{ steps.published-state.outputs.release_url }}
        run: |
          echo "### GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs:
      - release
      - quality-release
      - publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
      url: https://resume-os-phi.vercel.app
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Revalidate published tag and Release before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: >-
          node scripts/release-state.mjs
          --repo "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --sha "$RELEASE_SHA"
          --expect-published

      - name: Verify deployment secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }

      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.quality-release.outputs.node_version }}

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: >-
          node -e "const pkg = require('./package.json');
          if (process.env.RELEASE_TAG !== 'v' + process.env.RELEASE_VERSION || pkg.version !== process.env.RELEASE_VERSION) {
            console.error('Release tag, action output, and package.json version do not match.');
            process.exit(1);
          }"

      - name: Enable released package manager
        env:
          PNPM_VERSION: ${{ needs.quality-release.outputs.pnpm_version }}
        run: |
          corepack enable
          corepack "pnpm@$PNPM_VERSION" --version

      - name: Install Vercel CLI
        run: npm install --global vercel@56.3.1

      - name: Pull Vercel production configuration
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy released artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ needs.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
